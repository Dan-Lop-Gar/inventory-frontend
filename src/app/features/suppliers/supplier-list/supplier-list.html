<!-- supplier-list.component.html -->
<div class="page-container">
  <div class="page-header">
    <h2>Proveedores</h2>
  </div>

  @if (error()) { <div class="alert-error">{{ error() }}</div> }

  <mat-card>
    <mat-card-content>

      @if (loading()) {
        <div class="loading-container"><mat-spinner diameter="40"></mat-spinner></div>
      }

      <table mat-table [dataSource]="dataSource" class="w-full">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let s">{{ s.name }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let s">{{ s.email }}</td>
        </ng-container>

        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef>Teléfono</th>
          <td mat-cell *matCellDef="let s">{{ s.phone ?? '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="country">
          <th mat-header-cell *matHeaderCellDef>País</th>
          <td mat-cell *matCellDef="let s">{{ s.country ?? '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="active">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let s">
            <mat-chip-set>
              <mat-chip [color]="s.active ? 'primary' : ''" highlighted>
                {{ s.active ? 'Activo' : 'Inactivo' }}
              </mat-chip>
            </mat-chip-set>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let s">
            @if (authStore.isAdmin() && s.active) {
              <button mat-icon-button color="warn"
                      (click)="delete(s.id)"
                      matTooltip="Desactivar">
                <mat-icon>block</mat-icon>
              </button>
            }
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr *matNoDataRow>
          <td [colSpan]="displayedColumns.length" class="no-data">
            No hay proveedores
          </td>
        </tr>
      </table>

      <mat-paginator
        [length]="totalElements()"
        [pageSize]="pageSize()"
        [pageSizeOptions]="[10, 20, 50]"
        [pageIndex]="currentPage()"
        (page)="onPageChange($event)"
        showFirstLastButtons>
      </mat-paginator>

    </mat-card-content>
  </mat-card>
</div>
