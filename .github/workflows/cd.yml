name: CD — Build + Push + Update IAAC Frontend

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build:prod

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y Push imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/inventory-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/inventory-frontend:${{ github.sha }}

  update-iaac:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IAAC Frontend repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/inventory-iaac-frontend
          token: ${{ secrets.IAAC_TOKEN }}

      - name: Actualizar imagen en deployment.yml
        run: |
          sed -i \
            "s|image: .*/inventory-frontend:.*|image: ${{ secrets.DOCKER_USERNAME }}/inventory-frontend:${{ github.sha }}|g" \
            base/frontend/deployment.yml

      - name: Commit y Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add base/frontend/deployment.yml

          if git diff --cached --quiet; then
            echo "No hay cambios en la imagen"
            exit 0
          fi

          git commit -m "chore: update frontend image to ${{ github.sha }}"
          git push
